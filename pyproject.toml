[project]
dynamic = ["version"]
name = "basiclive"
description = "A Framework for creating beamline LIMS"
license = "MIT"
authors = [
    {name = "Kathryn Janzen",email = "kathryn.janzen@lightsource.ca"},
    {name = "Michel Fodje",email = "michel.fodje@lightsource.ca"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "Django >= 6.1.1",
    "Markdown",
    "cryptography",
    "django-colorfield",
    "django-crispy-forms",
    "django-formtools",
    "django-itemlist >= 2026.1.15",
    "django-model-utils",
    "djangorestframework >= 3.18.2",
    "djangorestframework-simplejwt",
    "crispy-bootstrap5",
    "geopy",
    "habanero",
    "msgpack",
    "numpy",
    "httpx2[zstd]",
    "timezonefinder",
    "fastjsonschema",
    "psycopg2-binary>=2.9.12",
    "pymemcache>=4.0.0",
    "django-crisp-modals >= 2026.1.2",
    "django-reportcraft (>=2026.9.9,<2027.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
]

[project.optional-dependencies]
ldap = [
    "django-python3-ldap",
    "ldap3",
]
cas = [
    "django-cas-ng",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["basiclive"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440" # Options: "pep440", "semver", "pvp"
fallback-version = "0.0.0" # Used if building outside a Git repo (e.g., from an sdist)
format = "{base}.{revision}{distance}"


