{% load static %}
{% load bl_tags %}

<style>
    table.regions {
      font-size: 0.95rem;
    }
    table.regions thead  th:not(:first-child), tbody td:not(:first-child) {
      text-align: right;
    }
    table.regions tbody  td:first-child {
      opacity: 0.6;
    }
    table.regions tbody  td:not(:first-child) {
      text-align: right;
    }
</style>

<div class="row py-3">
    <b> Edge:</b>&nbsp;{{ request.parameters.edge }}
</div>
<div id="request-{{request.pk}}" class="row"></div>


<script type="text/javascript" src="{% static 'd3/js/d3.min.js' %}"></script>
<script type="text/javascript" src="{% static 'lims/js/exafs-regions.js' %}"></script>
<script>
    let regions = {{ request.parameters | jsonify }};
    $('#request-{{request.pk}}').showRegions(regions);
</script>
