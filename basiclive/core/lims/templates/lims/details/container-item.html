<div class="col-6 col-sm-4">
    <a href="{% url "container-detail" pk=container.pk %}">
        <div class="border p-2">
            <div class="text-center">
                <div class="underline text-condensed overflow-ellipsis mb-1">
                    {{ container.name }}
                </div>
            </div>
            {% include "lims/details/container-layout.html" %}
            <div class="text-center">
                {% if container.parent %}
                    <span class="badge text-bg-info fw-light" title="Loaded in {{ container.parent }}">Loaded</span>
                {% else %}
                    <span class="badge text-bg-secondary fw-light" title="Not Loaded">None</span>
                {% endif %}
            </div>
        </div>
    </a>
</div>
